<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Мини игра</title>
</head>
<body style="text-align:center; margin-top:100px; font-family:Arial;">

<h1>Мини игра 💘</h1>

<div id="step1">
<p>Введите имя:</p>
<input type="text" id="name">
<p>Введите возраст:</p>
<input type="number" id="age">
<br><br>
<button onclick="nextStep()">Продолжить</button>
</div>

<div id="step2" style="display:none;">
<h2 id="greeting"></h2>
<p>Как настроение?</p>
<button onclick="finish()">Хорошо</button>
<button onclick="finish()">Очень хорошо</button>
<button onclick="finish()">Сижу скучаю, завтра 14 февраля</button>
</div>

<script>
function nextStep() {
let name = document.getElementById("name").value;
let age = document.getElementById("age").value;

if(name === "" || age === "") {
alert("Введите имя и возраст!");
return;
}

document.getElementById("greeting").innerText =
"Привет, " + name + "! Тебе " + age + " лет.";

document.getElementById("step1").style.display = "none";
document.getElementById("step2").style.display = "block";
}

function finish() {
window.location.href = "https://surblie.github.io/open-me-/";
}
</script>

</body>
</html>
